[SenseBox_Eye]
extends = esp32_base
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
  ${esp32_base.build_flags}
  -I variants/sensebox_eye
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D P_LORA_DIO_0=44
  -D P_LORA_DIO_1=44
  -D P_LORA_NSS=43
  -D P_LORA_RESET=RADIOLIB_NC
  -D P_LORA_SCLK=39
  -D P_LORA_MISO=40
  -D P_LORA_MOSI=38
  -D USE_SX1276
  -D LORA_TX_POWER=10
  -D PIN_BOARD_SDA=2
  -D PIN_BOARD_SCL=1
  -D PIN_OLED_RESET=-1
  -D DISPLAY_ADDRESS=0x3D
  -D DISPLAY_CLASS=SSD1306Display
  -D AUTO_OFF_MILLIS=0
  -I examples/companion_radio/ui-new
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/sensebox_eye>
  +<helpers/sensors>
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps = ${esp32_base.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13
  adafruit/Adafruit GFX Library @ ^1.11.11

[env:SenseBox_Eye_companion_radio_usb]
extends = SenseBox_Eye
build_flags =
  ${SenseBox_Eye.build_flags}
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=8
  -D ENABLE_USB_INTERFACE
build_src_filter = ${SenseBox_Eye.build_src_filter}
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${SenseBox_Eye.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:SenseBox_Eye_companion_radio_ble_usb]
extends = env:SenseBox_Eye_companion_radio_usb
build_flags =
  ${env:SenseBox_Eye_companion_radio_usb.build_flags}
  -D BLE_PIN_CODE=123456
build_src_filter = ${env:SenseBox_Eye_companion_radio_usb.build_src_filter}
  +<helpers/esp32/SerialBLEInterface.cpp>

[env:SenseBox_Eye_companion_radio_ble_usb_wifi]
extends = env:SenseBox_Eye_companion_radio_ble_usb
extra_scripts = pre:variants/sensebox_eye/embed_web.py
build_flags =
  ${env:SenseBox_Eye_companion_radio_ble_usb.build_flags}
  -D ENABLE_SAFEMS_KIOSK=1
